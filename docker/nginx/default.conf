server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    charset utf-8;

    # Dynamic DNS resolver do Docker (evita crash e 502 no startup)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Compressao Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Otimizacao de Assets Estaticos e Cache
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Roteamento do CodeIgniter 3
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Processamento PHP via FastCGI
    location ~ \.php$ {
        set $upstream_app app:9000;
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Bloqueio de arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
